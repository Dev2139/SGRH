  <!-- Subtitle: Managed by Brahm Shakti Trust (Regd.) · Budh Vihar, New Delhi -->
  <text x="94" y="69" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="500" fill="#64748B" letter-spacing="0.2">
    Managed by Brahm Shakti Trust (Regd.) &middot; Budh Vihar, New Delhi
